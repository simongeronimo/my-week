# Dockge stack for my-week. Dockge builds the image straight from GitHub at the tag below.
# Put APP_TOKEN, AGENT_TOKEN and FEED_TOKEN in the stack's .env file, each from: openssl rand -hex 32
services:
  my-week:
    build: https://github.com/simongeronimo/my-week.git#v0.3.0
    image: my-week:0.3.0          # to upgrade, change this version and the #tag above together
    container_name: my-week
    restart: unless-stopped
    user: "568:568"               # TrueNAS apps user; must own the data folder
    environment:
      TZ: Etc/UTC                 # replace with your zone, for example Europe/Berlin
      APP_TOKEN: ${APP_TOKEN}
      AGENT_TOKEN: ${AGENT_TOKEN:-}   # leave unset to keep the agent out
      FEED_TOKEN: ${FEED_TOKEN:-}     # leave unset to turn the calendar feed off
    volumes:
      - /mnt/tank/apps/my-week:/data   # your TrueNAS dataset
    networks:
      - apps
networks:
  apps:
    external: true                # shared with Nginx Proxy Manager and the planner agent
